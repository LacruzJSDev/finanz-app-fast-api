# Verifica, construye la imagen y despliega en el VPS.
#
# En push a `main`. En pull request se verifica pero NO se despliega, para poder
# ver en verde una rama antes de fusionarla.
#
# EL ORDEN IMPORTA: `verify` es dependencia de `build`, y `build` de `deploy`.
# Un despliegue que sale antes de que terminen los tests es un despliegue sin
# tests, y en algún momento saldrá con ellos en rojo.

name: deploy

on:
  push:
    branches: [main]
  pull_request:
  # Para poder relanzar un despliegue sin inventarse un commit vacío.
  workflow_dispatch:

concurrency:
  # Dos despliegues a la vez sobre el mismo VPS se pisan. El nuevo gana; el
  # viejo se cancela antes de tocar nada.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/lacruzjsdev/finanz-app-fast-api
  # Una ruta no es un secreto. Estuvo en `secrets.VPS_APP_DIR`, y eso significaba
  # que leyendo el repo no se podía saber dónde despliega, y que un valor mal
  # puesto fallaba con un `cd` críptico. Aquí es visible y versionada.
  APP_DIR: /opt/entramaes/infra/apps/finanzapp

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # pyright se invoca por npx (no hay package.json en este repo).
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Lint
        run: ruff check app alembic tests

      - name: Formato
        run: ruff format --check app alembic tests

      - name: Tipos
        run: npx --yes pyright

      # Los services mockean los repositorios (ver ARCHITECTURE.md §10), así
      # que no hace falta un servicio de Postgres en el runner. Las variables
      # son solo para que app.config.Settings no falle al importar.
      - name: Tests
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
          SECRET_KEY: test-secret-key
        run: python -m pytest tests/

  build:
    needs: verify
    # En un pull request se verifica pero no se publica imagen: no hay nada que
    # desplegar todavía y publicarla ensuciaría el registro.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN basta con `packages: write`: no hace falta un PAT.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # DOS ETIQUETAS, y la del SHA no es decorativa: es lo que permite
          # volver a una versión anterior sin reconstruir nada, cambiando la
          # etiqueta en el compose del servidor.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            docker compose -f docker-compose.yml pull finanzapp-api finanzapp-payment-plans-cron
            docker compose -f docker-compose.yml up -d
            # Las imágenes viejas se acumulan y llenan el disco del VPS.
            docker image prune -f

  # Este repo es PÚBLICO, así que su paquete no consume cupo de almacenamiento:
  # GitHub Free da 500 MB por cuenta, pero sólo cobra los paquetes privados.
  # Aquí la poda es higiene, no necesidad — mantiene el registro legible y evita
  # arrastrar cientos de versiones muertas. Si el repo pasara a privado, deja de
  # ser opcional.
  #
  # Cada push a main publica una versión :sha que nadie borra: el
  # `docker image prune` de arriba limpia el daemon del VPS, no el registro.
  #
  # GITHUB_TOKEN con `packages: write` basta para borrar; comprobado en la
  # landing el 21/08/2026, borró 8 versiones. No hace falta ningún PAT.
  #
  # OJO: min-versions-to-keep cuenta TODAS las versiones, incluidas las que no
  # llevan etiqueta, así que la profundidad real de rollback es menor que 10
  # despliegues.
  #
  # Va DESPUÉS del deploy y no bloquea, para que un problema aquí nunca deje un
  # despliegue a medias.
  podar-registro:
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      packages: write
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          owner: LacruzJSDev
          package-name: finanz-app-fast-api
          package-type: container
          min-versions-to-keep: 10
          # Nunca borrar la que está en producción.
          ignore-versions: '^latest$'
