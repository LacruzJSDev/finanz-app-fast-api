# Configuración base = PRODUCCIÓN.
#
# `docker compose up` carga automáticamente docker-compose.override.yml encima
# de este fichero, así que el comando corto SIEMPRE es desarrollo. Para
# producción hay que pedir explícitamente solo este fichero:
#
#   desarrollo:  docker compose up
#   producción:  docker compose -f docker-compose.yml up -d
#
# En producción no hay contenedor `db` ni puerto publicado propios: FinanzApp
# vive en el mismo VPS que el resto del enjambre de apps (entramaes-infra) y
# reutiliza su Postgres y su Caddy compartidos a través de la red externa
# `web`. Antes de desplegar, el usuario/base `finanzapp` deben existir ya
# dentro de ese Postgres compartido (no se crean solos, a diferencia de un
# contenedor de Postgres nuevo) — ver .env.example.
#
# Tampoco se construye la imagen aquí: la construye y publica el workflow de
# GitHub Actions (.github/workflows/deploy.yml), y el VPS solo hace `docker
# compose pull`. Para volver a una versión anterior sin reconstruir nada,
# basta con cambiar `:latest` por el `:<sha>` deseado y volver a hacer pull.
services:
  finanzapp-api:
    image: ghcr.io/lacruzjsdev/finanz-app-fast-api:latest
    container_name: finanzapp-api
    restart: unless-stopped
    # Todas las variables de Settings (SECRET_KEY, GOOGLE_*, CORS_*...) entran
    # por aquí, en tiempo de ejecución. El .env NO está dentro de la imagen:
    # .dockerignore lo excluye a propósito.
    env_file: .env
    environment:
      # `postgres` es el nombre del servicio compartido en entramaes-infra,
      # alcanzable por estar en la misma red `web`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: production
    # Sin `ports`: nada entra directo por el 8000 desde fuera del host. El
    # único camino de entrada es el Caddy compartido del VPS, que también
    # vive en `web` y reenvía a `finanzapp-api:8000`.
    networks:
      - web
    healthcheck:
      # La imagen es python:3.13-slim y no trae curl, así que se usa urllib.
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  finanzapp-payment-plans-cron:
    image: ghcr.io/lacruzjsdev/finanz-app-fast-api:latest
    container_name: finanzapp-payment-plans-cron
    restart: unless-stopped
    # cron necesita arrancar como root para poder ejecutar el job como
    # appuser (lo declara el propio /etc/cron.d/payment-plans-cron) — la
    # imagen arranca como appuser por defecto (ver Dockerfile), así que
    # aquí se sobrescribe solo para este servicio.
    user: root
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ENVIRONMENT: production
    networks:
      - web
    # No usa el ENTRYPOINT del Dockerfile (aplica migraciones): el servicio
    # api ya las aplica al arrancar, y para cuando el cron dispara por
    # primera vez (payment_plans.md §5) ya llevan horas aplicadas.
    entrypoint: []
    command: [ "./docker/cron-entrypoint.sh" ]

networks:
  # Red compartida por todo el enjambre de apps del VPS (Caddy, Postgres,
  # observabilidad...). La crea entramaes-infra, no este proyecto.
  web:
    external: true
