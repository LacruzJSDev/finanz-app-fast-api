# Compose de DESARROLLO únicamente.
#
# El compose de producción vive en el repo de infra
# (entramaes-infra/apps/finanzapp/compose.yaml), que conecta la API al
# Postgres y al Caddy compartidos del VPS. El despliegue lo hace el workflow
# de GitHub Actions (.github/workflows/deploy.yml) haciendo `docker compose
# pull` sobre ese fichero; este de aquí no interviene en producción.
services:
  db:
    image: postgres:16
    container_name: finanzapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - finanzapp_pgdata:/var/lib/postgresql/data
    # Publica la base en el host para poder conectarse con un cliente SQL o
    # ejecutar alembic desde el venv local. 5433 en vez de 5432 para no chocar
    # con un Postgres instalado directamente en la máquina.
    ports:
      - "5433:5432"
    healthcheck:
      # -d comprueba que la base concreta ya existe. Sin él, pg_isready puede
      # dar "sano" durante la inicialización, antes de que POSTGRES_DB esté
      # creada, y la api arrancaría contra una base inexistente.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    # Monta el código del host dentro del contenedor: al guardar un fichero,
    # --reload reinicia uvicorn sin necesidad de reconstruir la imagen.
    volumes:
      - .:/code
    env_file: .env
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # En macOS y Windows los eventos del sistema de ficheros no cruzan bien
      # el límite del bind mount; el sondeo periódico es menos eficiente pero
      # sí detecta los cambios.
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    # Sin `command`: el CMD del Dockerfile (app/run.py) ya activa --reload
    # solo, al ver ENVIRONMENT=development.

  payment-plans-cron:
    build: .
    # cron necesita arrancar como root para poder ejecutar el job como
    # appuser (lo declara el propio /etc/cron.d/payment-plans-cron) — la
    # imagen arranca como appuser por defecto (ver Dockerfile), así que
    # aquí se sobrescribe solo para este servicio.
    user: root
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # No usa el ENTRYPOINT del Dockerfile (aplica migraciones): el servicio
    # api ya las aplica al arrancar, y para cuando el cron dispara por
    # primera vez (payment_plans.md §5) ya llevan horas aplicadas.
    entrypoint: []
    command: [ "./docker/cron-entrypoint.sh" ]

volumes:
  finanzapp_pgdata:
