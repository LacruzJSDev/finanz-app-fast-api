# Ajustes de DESARROLLO. Docker Compose lo aplica encima de
# docker-compose.yml automáticamente al ejecutar `docker compose up`.
#
# En producción no hay `db` propio (usa el Postgres compartido del VPS), así
# que aquí se añade uno local completo solo para desarrollo, y se marca `web`
# como red local en vez de exigir que ya exista (en el VPS la crea
# entramaes-infra; en el portátil no existe).
services:
  db:
    image: postgres:16
    container_name: finanzapp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - finanzapp_pgdata:/var/lib/postgresql/data
    # Publica la base en el host para poder conectarse con un cliente SQL o
    # ejecutar alembic desde el venv local. 5433 en vez de 5432 para no chocar
    # con un Postgres instalado directamente en la máquina.
    ports:
      - "5433:5432"
    networks:
      - web
    healthcheck:
      # -d comprueba que la base concreta ya existe. Sin él, pg_isready puede
      # dar "sano" durante la inicialización, antes de que POSTGRES_DB esté
      # creada, y la api arrancaría contra una base inexistente.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    # En producción se usa la imagen publicada en GHCR; en desarrollo se
    # construye del código local (build + image juntos: Compose construye y
    # la etiqueta igual, así no hace falta acceso al registro para developar).
    build: .
    # En producción no hay `ports` (solo entra por Caddy vía `web`); en
    # desarrollo sí interesa poder pegarle directo desde el host.
    ports:
      - "8000:8000"
    # Monta el código del host dentro del contenedor: al guardar un fichero,
    # --reload reinicia uvicorn sin necesidad de reconstruir la imagen.
    volumes:
      - .:/code
    environment:
      ENVIRONMENT: development
      # En producción apunta al Postgres compartido (postgres:5432); en
      # desarrollo, al `db` de este mismo compose.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # En macOS y Windows los eventos del sistema de ficheros no cruzan bien
      # el límite del bind mount; el sondeo periódico es menos eficiente pero
      # sí detecta los cambios.
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    # Sin `command`: el CMD del Dockerfile (app/run.py) ya activa --reload
    # solo, al ver ENVIRONMENT=development.

  payment-plans-cron:
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

networks:
  web:
    external: false

volumes:
  finanzapp_pgdata:
